openapi: 3.1.0
info:
  title: Dakar WiFi — API métier
  version: 0.1.0
  description: API de la plateforme Wi-Fi public de la Ville de Dakar.
paths:
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Fermer la session
      tags:
      - authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      summary: Demander un code de vérification
      tags:
      - authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      summary: Vérifier le code et ouvrir une session
      tags:
      - authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      summary: Renouveler la session
      tags:
      - authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Liveness and readiness probe.
      summary: État de santé du service
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      summary: Profil du citoyen connecté
      tags:
      - compte
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citizen'
          description: ''
  /api/v1/me/entitlements:
    get:
      operationId: me_entitlements_retrieve
      summary: Droits d'accès du citoyen connecté
      tags:
      - compte
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
          description: ''
  /api/v1/portal/context:
    get:
      operationId: portal_context_retrieve
      summary: Contexte du portail pour une borne
      parameters:
      - in: query
        name: nas_id
        schema:
          type: string
        description: Identifiant réseau présenté par la borne. Seule source de vérité
          pour résoudre la zone.
        required: true
      - in: query
        name: redirect_url
        schema:
          type: string
        description: URL de retour fournie par la passerelle. Ignorée si son hôte
          n'est pas explicitement autorisé.
      tags:
      - portail
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalContext'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/portal/free-access:
    post:
      operationId: portal_free_access_create
      summary: Activer l'accès gratuit de la zone
      tags:
      - portail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeAccessRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FreeAccessRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FreeAccessRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/portal/plans:
    get:
      operationId: portal_plans_retrieve
      summary: Offres disponibles pour une borne
      parameters:
      - in: query
        name: nas_id
        schema:
          type: string
        description: Identifiant réseau présenté par la borne. Seule source de vérité
          pour résoudre la zone.
        required: true
      tags:
      - portail
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPlans'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/portal/terms:
    get:
      operationId: portal_terms_retrieve
      summary: Conditions à accepter
      tags:
      - portail
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsList'
          description: ''
  /api/v1/public/hotspots:
    get:
      operationId: public_hotspots_retrieve
      description: |-
        Sites the City publishes on its public map.

        Only sites explicitly marked public and actually geolocated are returned, and
        no equipment identifier ever leaves this endpoint (§8.9).
      summary: Carte publique des points d'accès
      tags:
      - portail
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSites'
          description: ''
components:
  schemas:
    Citizen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_e164:
          type: string
        email:
          type: string
        preferred_language:
          type: string
        status:
          type: string
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - email
      - id
      - phone_e164
      - preferred_language
      - status
      - verified_at
    Entitlement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        status:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        zone:
          type: string
          readOnly: true
        plan:
          type: string
          readOnly: true
      required:
      - ends_at
      - id
      - plan
      - source
      - starts_at
      - status
      - zone
    EntitlementList:
      type: object
      properties:
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
      required:
      - entitlements
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    Fallback:
      type: object
      properties:
        active:
          type: boolean
        reason:
          type: string
      required:
      - active
      - reason
    FreeAccessRequestRequest:
      type: object
      properties:
        nas_id:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - nas_id
    Health:
      type: object
      properties:
        status:
          type: string
          description: '''ok'' or ''unavailable'''
        environment:
          type: string
          description: local, test, staging or production
        version:
          type: string
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - environment
      - status
      - version
    HealthChecks:
      type: object
      properties:
        database:
          type: string
          description: '''ok'' or ''error'''
        cache:
          type: string
          description: '''ok'' or ''error'''
      required:
      - cache
      - database
    OtpRequestRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - phone
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        code:
          type: string
          minLength: 1
          maxLength: 10
        accepted_terms:
          type: array
          items:
            type: string
            format: uuid
      required:
      - accepted_terms
      - code
      - phone
    PlanOffer:
      type: object
      description: |-
        Public view of an offer.

        Deliberately omits `radius_profile_ref`: RADIUS references belong to the network
        layer and must never appear in a payload served to a browser (§8.9).
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
        price_xof:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        connection_seconds:
          type:
          - integer
          - 'null'
          readOnly: true
        validity_seconds:
          type:
          - integer
          - 'null'
          readOnly: true
        quota_total_bytes:
          type:
          - integer
          - 'null'
          readOnly: true
        bandwidth_down_kbps:
          type:
          - integer
          - 'null'
          readOnly: true
        bandwidth_up_kbps:
          type:
          - integer
          - 'null'
          readOnly: true
        max_simultaneous_sessions:
          type: integer
          readOnly: true
      required:
      - bandwidth_down_kbps
      - bandwidth_up_kbps
      - code
      - connection_seconds
      - currency
      - description
      - max_simultaneous_sessions
      - name
      - price_xof
      - quota_total_bytes
      - type
      - validity_seconds
    PortalContext:
      type: object
      properties:
        zone:
          $ref: '#/components/schemas/Zone'
        site:
          $ref: '#/components/schemas/Site'
        fallback:
          $ref: '#/components/schemas/Fallback'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanOffer'
        redirect_url:
          type:
          - string
          - 'null'
      required:
      - fallback
      - plans
      - redirect_url
      - site
      - zone
    PortalPlans:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanOffer'
      required:
      - plans
    PublicSite:
      type: object
      description: Map entry. Carries nothing that identifies equipment (§8.9).
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        status:
          type: string
        hotspot_count:
          type: integer
        access_modes:
          type: array
          items:
            type: string
      required:
      - access_modes
      - address
      - hotspot_count
      - latitude
      - longitude
      - name
      - status
    PublicSites:
      type: object
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/PublicSite'
      required:
      - sites
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Site:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        organization:
          type: string
          readOnly: true
      required:
      - address
      - name
      - organization
    TermsList:
      type: object
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TermsVersion'
      required:
      - terms
    TermsVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        version:
          type: string
        content_url:
          type: string
        summary:
          type: string
      required:
      - content_url
      - id
      - summary
      - type
      - version
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        access_expires_in:
          type: integer
        citizen:
          $ref: '#/components/schemas/Citizen'
      required:
      - access
      - access_expires_in
      - citizen
      - refresh
    Zone:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        access_mode:
          type: string
        timezone:
          type: string
        welcome_message:
          type: string
      required:
      - access_mode
      - code
      - label
      - timezone
      - welcome_message
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
