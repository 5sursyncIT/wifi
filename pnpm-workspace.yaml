packages:
  - "apps/*"
  - "packages/*"

# Astro pins the vite it builds against and @tailwindcss/vite accepts a wide range, so
# without a single pin the tree resolves two copies with incompatible plugin types.
# Follow astro's own dependency when upgrading it: astro 7 builds on vite 8, and vitest
# must accept the same major (vitest 3 stops at vite 7).
overrides:
  vite: "^8.0.13"
# Native binaries required by the toolchain. Reviewed explicitly: pnpm blocks
# post-install scripts by default and every addition must be justified here.
allowBuilds:
  esbuild: true # bundler used by vitest
  sharp: true # image pipeline used by next
  unrs-resolver: true # module resolver used by eslint
